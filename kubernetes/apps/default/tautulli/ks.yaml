---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tautulli
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/tautulli/app
  postBuild:
    substitute:
      APP: tautulli
      # Migrated to kopiur and verified by a restore from the garage repository
      # (tautulli.db + config.ini + cache/logs, 93.9M). This stops the NFS-side
      # ReplicationSource, whose kopia cache is corrupted and looping. The NFS
      # repository keeps every snapshot it already has.
      # VolSync detached 2026-09-23 - the claim now comes from components/kopiur/restore
      # and kopiur/restore + components/volsync must never be included together.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
