---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/restore
    - ../../../../components/zeroscaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/minecraft/app
  postBuild:
    substitute:
      APP: *app
      # kopiur migration: snapshot + restore from the garage repository verified
      # VolSync detached 2026-09-24 - the claim now comes from components/kopiur/restore
      # and kopiur/restore + components/volsync must never be included together.
      # The world is saved on SIGTERM, so the drill order is scale-down, THEN snapshot:
      # otherwise the hydrate source is whatever the last hourly tick caught mid-play.
      GATUS_SUBDOMAIN: mcmap
      # DR PVC sizing: 1.77 GB today with room for world growth; less than
      # the current 16Gi claim, which is the deliberate trade.
      KOPIUR_CAPACITY: 10Gi
      #VOLSYNC_SCHEDULE: "0 */3 * * *" # Every 3hrs
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: false
