apiVersion: v1
kind: Pod
metadata:
  name: mc-helper
  namespace: default
spec:
  restartPolicy: Never
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: minecraft
  containers:
    - name: helper
      image: alpine
      command: ["/bin/sh", "-c", "sleep 86400"]
      volumeMounts:
        - name: data
          mountPath: /data
