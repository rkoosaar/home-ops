---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plex
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  dependsOn:
    - name: intel-gpu-resource-driver
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/plex/app
  postBuild:
    substitute:
      APP: plex
      # kopiur migration: snapshot + restore from the garage repository verified
      # (89496/89496 files, 13.6GiB restored).
      VOLSYNC_PAUSED: "true"
      # DR PVC sizing: 13.35 GiB of data; 30Gi leaves ~2.2x headroom.
      # Note this is below the current 50Gi claim, so a DR would recreate the
      # volume smaller - fine, since ceph expansion is grow-only later.
      KOPIUR_CAPACITY: 30Gi
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_CACHE_CAPACITY: 50Gi
      #VOLSYNC_SCHEDULE: "0 */3 * * *" # Every 3hrs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
