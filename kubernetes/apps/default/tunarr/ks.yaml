---
# yaml-language-server: $schema=https://my-kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tunarr
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/restore
    - ../../../../components/zeroscaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/tunarr/app
  postBuild:
    substitute:
      APP: tunarr
      # tunarr runs as root, so its PVC is root-owned; the mover's staged source
      # is read-only, which rules out an fsGroup grant, so this is the documented
      # root-mover case. One-shot verified: 132 files / 410706157 bytes, matching
      # VolSync's own count for the same volume.
      KOPIUR_PUID: "0"
      KOPIUR_RUNASNONROOT: "false"
      # Restore verified: 132/132 files out of the root-mover snapshot.
      # VolSync detached 2026-09-24 - the claim now comes from components/kopiur/restore
      # and kopiur/restore + components/volsync must never be included together.
      GATUS_SUBDOMAIN: tv
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
