---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookboss
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/bookboss/app
  postBuild:
    substitute:
      APP: bookboss
      # kopiur migration: snapshot + restore from the garage repository verified
      # (3 files / 7004360 bytes, re-verified 2026-09-22). VolSync removed; the DR
      # PVC comes from components/kopiur/restore at the 5Gi default.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: false
