---
# yaml-language-server: $schema=https://my-kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: neko
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  interval: 1h
  path: ./kubernetes/apps/default/neko/app
  postBuild:
    substitute:
      APP: neko
      VOLSYNC_CAPACITY: 17Gi
      # kopiur migration: snapshot + restore from the garage repository verified
      # (160/160 files, 113.4M). Stops the NFS-side ReplicationSource.
      VOLSYNC_PAUSED: "true"
      #SUBDOMAIN: movienight
      #VOLSYNC_SCHEDULE: "0 */3 * * *" # Every 3hrs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
