---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app synapse
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: matrix-synapse
  values:
    serverName: "${SECRET_DOMAIN}"
    publicServerName: "matrix.${SECRET_DOMAIN}"

    config:
      reportStats: false

    postgresql:
      enabled: false
    redis:
      enabled: false
    ingress:
      enabled: false

    externalPostgresql:
      host: postgres17-rw.database.svc.cluster.local
      port: 5432
      username: synapse
      database: synapse
      existingSecret: synapse-secret
      existingSecretPasswordKey: POSTGRES_PASSWORD

    externalRedis:
      host: dragonfly.database.svc.cluster.local
      port: 6379
      dbid: 14
      existingSecret: synapse-secret
      existingSecretPasswordKey: REDIS_PASSWORD

    signingkey:
      job:
        enabled: false
      existingSecret: synapse-secret
      existingSecretKey: SIGNING_KEY

    volumePermissions:
      enabled: true

    persistence:
      enabled: true
      existingClaim: *app

    synapse:
      strategy:
        type: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
        prometheus.io/scrape: "true"
        prometheus.io/path: "/_synapse/metrics"
        prometheus.io/port: "9090"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    # Client-to-server API access (federation is deferred — needs apex-domain
    # routing + a public inbound path for the federation port).
    gateway:
      enabled: true
      csHosts:
        - "matrix.${SECRET_DOMAIN}"
      includeServerName: false
      parentRefs:
        - name: envoy-internal
          namespace: network

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: synapse-matrix-synapse
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: synapse-matrix-synapse
              spec:
                template:
                  spec:
                    initContainers:
                      - name: init-db
                        image: ghcr.io/rkoosaar/postgres-init:17
                        envFrom:
                          - secretRef:
                              name: synapse-secret
