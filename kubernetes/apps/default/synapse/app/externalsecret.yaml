---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: synapse-secret
    template:
      data:
        # Federation signing key (format: "ed25519 <base64>")
#        SIGNING_KEY: "{{ .SIGNING_KEY }}"
        # Redis (Dragonfly)
        REDIS_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        # Postgres (CNPG)
        POSTGRES_PASSWORD: &dbpass "{{ .SYNAPSE_POSTGRES_PASSWORD }}"
        # Postgres init (creates the synapse db + user in the CNPG cluster)
        INIT_POSTGRES_DBNAME: "{{ .SYNAPSE_POSTGRES_DB }}"
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .SYNAPSE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: dragonfly
#    - extract:
#        key: matrix
