---
# yaml-language-server: $schema=https://my-kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ersatztv
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/ersatztv/app
  postBuild:
    substitute:
      APP: ersatztv
      # kopiur migration: snapshot + restore from the garage repository verified
      # VolSync detached 2026-09-23 - the claim now comes from components/kopiur/restore
      # and kopiur/restore + components/volsync must never be included together.
      #GATUS_SUBDOMAIN: ersatztv
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
