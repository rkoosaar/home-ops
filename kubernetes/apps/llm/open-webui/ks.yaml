---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  interval: 1h
  path: ./kubernetes/apps/llm/open-webui/app
  postBuild:
    substitute:
      APP: open-webui
      # Restore verified from the garage repository (exact file-count match).
      # VolSync detached 2026-09-24 - the claim now comes from components/kopiur/restore
      # and kopiur/restore + components/volsync must never be included together.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
  wait: false
