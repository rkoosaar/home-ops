---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  # 1h is ESO's default; edits to the item would otherwise sit invisible that long
  # (that is what made a filled-in DEEPSEEK_API_KEY look empty for an hour).
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes
    template:
      data:
        # Gateway <-> dashboard API auth (mandatory when the API server is exposed)
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        # LLM provider — DeepSeek (OpenAI-compatible)
        DEEPSEEK_API_KEY: "{{ .DEEPSEEK_API_KEY }}"
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        # Matrix gateway. MATRIX_HOME_ROOM is the Matrix adapter's name for the
        # cron/proactive delivery target (MATRIX_HOME_CHANNEL is the naming the
        # other platforms use and is not read here).
        MATRIX_HOMESERVER: "{{ .MATRIX_HOMESERVER }}"
        MATRIX_USER_ID: "{{ .MATRIX_USER_ID }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        MATRIX_ALLOWED_USERS: "{{ .MATRIX_ALLOWED_USERS }}"
        MATRIX_HOME_ROOM: "{{ .MATRIX_HOME_ROOM }}"
        # Dashboard basic auth
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .DASHBOARD_USERNAME }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .DASHBOARD_PASSWORD }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .DASHBOARD_SESSION_SECRET }}"
        # GitHub token (for git ops / gh CLI)
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: hermes
