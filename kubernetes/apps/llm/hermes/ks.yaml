---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/llm/hermes/app
  postBuild:
    substitute:
      APP: hermes
      # Restore verified from the garage repository (exact file-count match).
      # VolSync detached 2026-09-24 - the claim now comes from components/kopiur/restore
      # and kopiur/restore + components/volsync must never be included together.
      # mover parity: this app pins 10000:10000, so the default 1000:100 mover can
      # read files the workload creates as 10000.
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
  wait: false
