---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
        # The chart's default is 172800 (48h), which is far too slow for an
        # hourly fleet: a policy that silently stops producing snapshots — no
        # CRs, no Events, no log lines — would go unnoticed for two days. 4h
        # tolerates three consecutive missed ticks while still alerting the same
        # day, and it complements KopiurBackupConsecutiveFailures (3 failures,
        # ~3h) rather than duplicating it: that one covers policies that FAIL,
        # this one covers policies that go QUIET.
        backupStaleAfterSeconds: 14400
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
