---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: synapse-secret
    template:
      data:
        SIGNING_KEY: "{{ .SIGNING_KEY }}"
        REDIS_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        POSTGRES_PASSWORD: &dbpass "{{ .SYNAPSE_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_DBNAME: "{{ .SYNAPSE_POSTGRES_DB }}"
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .SYNAPSE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: dragonfly
    - extract:
        key: matrix
---
# Renders resources/mas_config.yaml into a Secret, resolving the shared secret from the
# same 1Password field mas reads as `matrix.secret` (they must be identical).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-mas
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: synapse-mas-secret
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: synapse-mas-configmap
            items:
              - key: mas_config.yaml
  dataFrom:
    - extract:
        key: matrix
