---
# Standalone route replacing the chart-generated HTTPRoute (`gateway.enabled: false` in
# the HelmRelease), so the MAS compat endpoints can be split onto a different backend.
# Content is the chart's route plus the auth endpoints, with the same 60s timeouts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
spec:
  hostnames:
    - "matrix.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    # Legacy-client authentication goes to MAS, not Synapse: after delegation these
    # endpoints are served by MAS's compat layer. Longest PathPrefix wins, so these
    # are matched ahead of the /_matrix rule below. Covers r0/v1/v3 plus the
    # sub-paths MAS serves (/login/sso/redirect, /logout/all).
    - matches:
        - path: { type: PathPrefix, value: /_matrix/client/r0/login }
        - path: { type: PathPrefix, value: /_matrix/client/r0/logout }
        - path: { type: PathPrefix, value: /_matrix/client/r0/refresh }
        - path: { type: PathPrefix, value: /_matrix/client/v1/login }
        - path: { type: PathPrefix, value: /_matrix/client/v1/logout }
        - path: { type: PathPrefix, value: /_matrix/client/v1/refresh }
        - path: { type: PathPrefix, value: /_matrix/client/v3/login }
        - path: { type: PathPrefix, value: /_matrix/client/v3/logout }
        - path: { type: PathPrefix, value: /_matrix/client/v3/refresh }
      backendRefs:
        - name: mas
          namespace: matrix
          port: 8080
    # Everything else stays on the homeserver.
    - matches:
        - path: { type: PathPrefix, value: /_matrix }
        - path: { type: PathPrefix, value: /_synapse }
      timeouts:
        request: 60s
        backendRequest: 60s
      backendRefs:
        - name: synapse-matrix-synapse
          namespace: matrix
          port: 8008
