---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuwunel
spec:
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/matrix/tuwunel/app
  postBuild:
    substitute:
      APP: tuwunel
      # Restore verified from the garage repository (exact file-count match).
      # VolSync detached 2026-09-24 - the claim now comes from components/kopiur/restore
      # and kopiur/restore + components/volsync must never be included together.
      # Note: this is the Matrix homeserver, so the drill window also drops the agent's
      # own comms. Nothing else about this app's config is treated differently.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
  wait: false
