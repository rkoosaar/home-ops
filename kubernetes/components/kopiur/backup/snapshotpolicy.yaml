---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  repository:
    kind: ClusterRepository
    name: garage
  sources:
    - pvc:
        name: ${APP}
  copyMethod: Snapshot
  compression:
    compressor: zstd
  # GFS window. Matches the VolSync retention this replaces (retain.hourly 24 /
  # daily 7) plus a weekly window; keepLatest always holds the freshest copies.
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  mover:
    cache:
      # Ephemeral cache (emptyDir, GC'd with the mover Job) — no per-app cache
      # PVC to fill up. Switch to Persistent + capacity/storageClassName only if
      # you want a warm cache across runs; the repository-level budgets in the
      # ClusterRepository are what keep it from filling the volume either way.
      mode: Ephemeral
    # Parity with the VolSync component this replaces: its mover pod ran with
    # fsGroup = PGID, so the kubelet's group grant landed on the group the mover
    # process actually uses. kopiur's mover pod otherwise keeps its own default
    # (65532) while the process runs 1000:100, which leaves data owned by another
    # UID unreadable and fails the snapshot with PermissionDenied.
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=100}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=100}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
