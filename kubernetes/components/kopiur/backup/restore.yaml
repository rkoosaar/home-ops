---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
# Passive restore: the PVC above points at this object, so it hydrates the
# volume while it is being provisioned. onMissingSnapshot: Continue means an app
# with no snapshot yet comes up empty instead of wedging (deploy-or-restore).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: ${APP}
      # 0 = latest snapshot
      offset: 0
  target:
    populator: {}
  # Same fsGroup as the policy's mover: a DR restore writes into the app's own
  # volume, so the group it stamps has to match what the running app expects.
  mover:
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=100}
    # Run as the identity RECORDED on the backup (Snapshot.status.recorded,
    # decoded from the kopiur-meta tag) rather than the restore mover's own uid.
    # Without this every restored file is stamped 65532, which leaves an app
    # unable to write its own data: kanidm runs as 999 and tunarr as root.
    # Upstream has no mover block at all because every app of his runs as 1000;
    # ours does not, so this is a deliberate local addition. The privileged-mover
    # gate still applies: a recorded ROOT identity (tunarr) is only permitted
    # because namespace default carries the privileged-movers annotation.
    inheritSecurityContextFrom:
      snapshot: {}
