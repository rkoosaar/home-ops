---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Backups: the half every app needs, included from each app's ks.yaml.
#
# The deploy-or-restore half - the app's PVC plus the Restore populator that
# hydrates it - lives in components/kopiur/restore and is included per app at
# cutover, NOT here. Enabling it fleet-wide in one reconcile would repoint 26 LIVE
# claims simultaneously, and a PVC's spec is immutable after creation, so every one
# of those applies would be rejected and the Kustomizations would wedge. Upstream
# keeps all four files in one component because his rollout was big-bang; ours
# cannot be.
resources:
  - ./snapshotpolicy.yaml
  - ./snapshotschedule.yaml
