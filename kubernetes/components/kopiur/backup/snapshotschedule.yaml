---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    # "H" is a hashed, deterministic minute: it spreads the fleet across the
    # hour instead of firing every app's mover at minute 0 (what the VolSync
    # "0 * * * *" schedule did).
    cron: H * * * *
    jitter: 2m
    timezone: Europe/London
