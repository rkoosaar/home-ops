---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-repository-secret
    # The Secret name is fixed (the ClusterRepository references it by name), so
    # this component renders once per NAMESPACE, not once per app.
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .GARAGE_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .GARAGE_SECRET_ACCESS_KEY }}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: garage
    - extract:
        key: kopiur
  refreshInterval: 1h
