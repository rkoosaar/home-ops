---
# The app's data PVC, hydrated by the passive Restore volume-populator below.
# Included per app at cutover - see kustomization.yaml for the two-apply recipe.
# A PVC's spec is immutable after creation, so this can only ever be CREATED:
# applying it over a live claim (e.g. the VolSync one, whose dataSourceRef points
# at a ReplicationDestination) is rejected and wedges the Kustomization, so the old
# claim is pruned first - which is why the drill is ordered that way.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
spec:
  accessModes:
    - ${KOPIUR_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
  resources:
    requests:
      storage: ${KOPIUR_CAPACITY:=5Gi}
  storageClassName: ${KOPIUR_STORAGECLASS:=ceph-block}
